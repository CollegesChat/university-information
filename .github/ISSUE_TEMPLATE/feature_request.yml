name: ✨ 新功能请求
description: 提交网站功能改进或新功能建议
title: "[功能请求]："
labels: ["enhancement"]
body:
  - type: input
    id: feature
    attributes:
      label: 功能名称
      description: 简要描述你希望新增的功能
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个功能解决什么问题或痛点
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 具体方案
      description: 你希望这个功能如何实现
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充说明