# v2 答卷的脏数据补丁。
# 每条规则用 type 区分（缺省 void）：
#   void               —— 按「答卷序号 × 题号」整题作废；
#                        status: empty（默认，置「(空)」）| skipped（置「(跳过)」）
#   reclassify_option  —— 把整题答案改判为指定选项；
#                        option: 目标选项文本；
#                        additional_text: 覆写附加文本（优先于 keep）；
#                        keep_additional_text: true 保留受访者原文（仅单选形态）；
#                        两者都不写 = 丢弃附加文本
# 通用字段：questions: 题号列表；nums: 答卷序号（CSV 的「序号」列），可选

- type: void
  questions: [27]
  nums: [324, 328, 329, 332]
  # 问卷没有「无」选项且强制至少选一个，受访者在补充文字里明确表示并没有
  # （324：早自习；328/329/332：晨跑/早操/升旗）

- type: void
  questions: [7, 8, 9, 10]
  nums: [307]
  status: skipped
  # 本科答卷误答研究生题目（导师/工位/补助/异地联培）

# Q12 改判：勾了空调但附加文本表示没有（选项集 10-15 扩容后暴露的矛盾）
- type: reclassify_option
  questions: [12]
  nums: [310]
  option: 其他情况
  additional_text: 教室基本没有空调

- type: reclassify_option
  questions: [12]
  nums: [334]
  option: 其他情况
  additional_text: 宿舍、教室都没有空调

- type: reclassify_option
  questions: [12]
  nums: [397]
  option: 其他情况
  additional_text: 教室、宿舍都没有空调

- type: reclassify_option
  questions: [12]
  nums: [401]
  option: 宿舍有电扇
  keep_additional_text: true

- type: reclassify_option
  questions: [17]
  nums: [307, 322, 333, 354, 408, 414]
  option: 既查寝又封寝
  keep_additional_text: true
